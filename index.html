<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Dawnline</title>
<meta name="description" content="The sun's path and every prayer-time convention, side by side.">
<meta name="theme-color" content="#0b1430">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dawnline">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<main class="page" id="main" hidden>
  <header class="top">
    <button class="place-btn" id="placeBtn" type="button" aria-label="Change place">
      <span class="place-name" id="placeName">Dawnline</span>
      <span class="coords" id="coords"></span>
    </button>
    <div class="top-actions">
    <button class="icon-btn" id="guideBtn" type="button" aria-label="How prayer times work">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.3 5.3 7.9 4.8 4.5 5v12.5c3.4-.2 5.8.3 7.5 1.5 1.7-1.2 4.1-1.7 7.5-1.5V5c-3.4-.2-5.8.3-7.5 1.5zM12 6.5V19"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
    </button>
    </div>
  </header>
  <p class="next" id="next" aria-live="polite"></p>

  <section class="card" aria-label="The sun and the methods">
    <div class="readout">
      <button class="angle-now" id="angleBtn" type="button" aria-label="Sun's angle. Tap to type an angle.">
        <span id="angleNow">—</span>
        <svg class="kbd" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6.5" width="18" height="11" rx="2.2"/><path d="M7 10h.01M10.5 10h.01M14 10h.01M17 10h.01M8 14h8"/></svg>
      </button>
      <div class="clock" id="clock"></div>
      <div class="readout-sub">
        <span class="trend-line"><span id="trend"></span><span class="moment-name" id="momentName" aria-live="polite"></span></span>
        <span class="date-row">
          <button class="chip chip-now" id="nowBtn" type="button" hidden>Now</button>
          <label class="chip date-chip"><span id="dateLabel"></span><input id="dateInput" type="date" aria-label="Pick a date"></label>
        </span>
      </div>
    </div>
    <p class="passed" id="passed"></p>
    <div class="pills" id="pills"></div>
    <div class="plot" id="plot">
      <svg id="graph" class="graph" role="img" tabindex="0" aria-label="Sun altitude through the day"></svg>
      <div class="graph-info" id="graphInfo"></div>
      <svg id="axis" class="axis" aria-hidden="true"></svg>
      <div class="bars-info" id="barsInfo"></div>
      <svg id="bars" class="bars" role="img" aria-label="Prayer times by method"></svg>
      <div class="pop" id="pop" role="dialog" aria-live="polite" hidden></div>
    </div>
  </section>

  <section class="card moments" id="moments" aria-label="Key moments"></section>
  <p class="foot">Times are computed on this phone, for any day. Nothing is sent anywhere.</p>
</main>
<dialog id="sheet" class="sheet" aria-label="Details"></dialog>
<noscript><p class="foot">Dawnline needs JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
